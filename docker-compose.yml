services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: agentic-trip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_agent
      POSTGRES_USER: travel_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-travel_app_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_app -d travel_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: agentic-trip-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  ollama:
    image: ollama/ollama:latest
    container_name: agentic-trip-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-trip-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      mailpit:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/travel_agent
      DB_USERNAME: travel_app
      DB_PASSWORD: ${DB_PASSWORD:-travel_app_local}
      SESSION_COOKIE_SECURE: "false"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS: "false"
      TRAVEL_AUTH_MAIL_FROM: noreply@agentictrip.local
      TRAVEL_AUTH_RESET_BASE_URL: http://localhost:8081
      TRAVEL_MCP_CLIENT_ENABLED: ${TRAVEL_MCP_CLIENT_ENABLED:-true}
      TRAVEL_MCP_SERVER_URL: ${TRAVEL_MCP_SERVER_URL:-http://host.docker.internal:8090}
      OLLAMA_BASE_URL: http://ollama:11434
      TRAVEL_JEV_BASE_URL: http://ollama:11434
      TRAVEL_JEV_ENABLED: ${TRAVEL_JEV_ENABLED:-true}
      TRAVEL_JEV_PROVIDER: ${TRAVEL_JEV_PROVIDER:-ollama}
      TRAVEL_JEV_API_KEY: ${TRAVEL_JEV_API_KEY:-ollama}
      TRAVEL_JEV_MODEL: ${TRAVEL_JEV_MODEL:-tev1:4b}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  postgres-data:
  ollama-data:
