<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Sign in · AgenticTripAI</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif;color:#edf5ff;background:radial-gradient(circle at top,#173c69 0,transparent 38%),linear-gradient(135deg,#020b18,#0a182d)}
        .card{width:min(430px,calc(100% - 32px));padding:34px;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(13,27,46,.94);box-shadow:0 25px 80px rgba(0,0,0,.4)}
        .brand{font-size:24px;font-weight:800;margin-bottom:8px}.sub{color:#9fb4ce;margin:0 0 26px}.label{display:block;color:#b9cbe0;font-size:13px;margin:16px 0 7px}.input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#09172a;color:#fff;outline:none}.input:focus{border-color:#4b9cff;box-shadow:0 0 0 3px rgba(75,156,255,.12)}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#3f8df5;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.msg{padding:11px 13px;border-radius:10px;margin:12px 0;font-size:13px}.error{background:rgba(220,70,70,.14);color:#ffb4b4;border:1px solid rgba(220,70,70,.2)}.success{background:rgba(65,190,115,.14);color:#a8efc5;border:1px solid rgba(65,190,115,.2)}.foot{margin-top:20px;text-align:center;color:#8fa6c1;font-size:13px}.foot a{color:#79b1ff;text-decoration:none}.hint{font-size:11px;color:#7890aa;margin-top:8px}
    </style>
</head>
<body>
<main class="card">
    <div class="brand">✈ AgenticTripAI</div>
    <p class="sub">Sign in to your private travel workspace.</p>
    <div th:if="${param.error}" class="msg error">Invalid username or password.</div>
    <div th:if="${param.logout}" class="msg success">You have been signed out.</div>
    <div th:if="${param.expired}" class="msg error">Your session expired. Please sign in again.</div>
    <div th:if="${success}" class="msg success" th:text="${success}"></div>
    <form method="post" action="/login">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label class="label" for="username">Username</label>
        <input class="input" id="username" name="username" autocomplete="username" required autofocus>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><label class="label" for="password" style="margin:0">Password</label><a href="/forgot-password" style="color:#79b1ff;font-size:12px;text-decoration:none">Forgot password?</a></div>
        <input class="input" id="password" type="password" name="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
    <div class="foot">New here? <a href="/register">Create an account</a></div>
</main>
</body>
</html>
