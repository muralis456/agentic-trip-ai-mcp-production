spring:
  thymeleaf:
    cache: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

server:
  servlet:
    session:
      cookie:
        secure: false

travel:
  auth:
    reset-base-url: ${TRAVEL_AUTH_RESET_BASE_URL:http://localhost:8081}
    mail-from: ${TRAVEL_AUTH_MAIL_FROM:noreply@agentictrip.local}
  mailpit:
    # Native Mailpit is used for local development; Docker is not required.
    enabled: ${TRAVEL_MAILPIT_ENABLED:true}
    executable: ${MAILPIT_EXE:C:/softwares/mailpit-windows-amd64/mailpit.exe}
    host: ${MAILPIT_HOST:localhost}
    smtp-port: ${MAILPIT_SMTP_PORT:1025}
    ui-port: ${MAILPIT_UI_PORT:8025}
    # Keep the Mailpit SQLite database across application restarts.
    database: ${MAILPIT_DATABASE:./data/mailpit/mailpit.db}
    # 0 disables count-based message pruning.
    max-messages: ${MAILPIT_MAX_MESSAGES:0}
